name: Tests

on:
  # Only new pushes: claude-code-review.yml calls this workflow when a PR is opened,
  # reopened, or marked ready, so triggering on those too would run every test twice.
  pull_request:
    types: [synchronize]
  workflow_call:

permissions:
  contents: read

jobs:
  # The project needs Xcode 27, which only the xcode-27 image ships. macOS 26 testing is
  # paused until the macos-26 image adds Xcode 27, which runs on macOS 26.6 and later.
  test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project ProfilePal.xcodeproj
          -scheme ProfileManifestKit
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
