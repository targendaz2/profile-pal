name: Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  # The project needs Xcode 27, which only the xcode-27 image ships. macOS 26 testing is
  # paused until the macos-26 image adds Xcode 27, which runs on macOS 26.6 and later.
  test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ProfileManifestKit tests
        run: >-
          xcodebuild test
          -project ProfilePal.xcodeproj
          -scheme ProfileManifestKit
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Run VersionKit tests
        run: >-
          xcodebuild test
          -project ProfilePal.xcodeproj
          -scheme VersionKit
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
