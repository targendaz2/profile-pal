name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**/*.swift"
      - "**/*.pbxproj"
      - "**/*.entitlements"
      - "**/*.plist"
      - "**/Package.resolved"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**/*.md"
      - ".github/workflows/code-review.yml"

jobs:
  code-review:
    if: >-
      github.event.pull_request.user.login == 'targendaz2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            
          plugins: |
            code-review@claude-plugins-official
          
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

          # --allowedTools is the whole list for the run: the plugin's own allowed-tools cover only
          # its main session, so its subagents need Agent/Task to launch and the read tools and gh
          # commands they use. --disallowedTools keeps Read away from secrets in the process
          # environment, dotfiles, and the runner's temp directory.
          claude_args: >-
            --allowedTools
            "Agent,Task,TodoWrite,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools
            "Read(//proc/**),Read(~/.*),Read(/${{ runner.temp }}/**)"

      # The full output stays hidden because this repository is public. This prints only which
      # tool calls were denied, so a gap in --allowedTools shows up in the log: each denial's tool
      # name, plus the first words of a Bash command or the path a read tool asked for. Nothing the
      # tools returned is printed.
      - name: Log permission denials
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '
            (if type == "array" then .[] else . end) | select(.type == "result")
            | (.permission_denials // []) as $denials
            | "Permission denials: \($denials | length)",
              ($denials[] | .tool_input as $in | "  \(.tool_name)" + (
                if .tool_name == "Bash" then
                  " \(($in.command // "") | split(" ") | .[0:3] | join(" "))"
                elif ($in.file_path // $in.path) != null then
                  " \($in.file_path // $in.path)"
                else "" end))
          ' "$EXECUTION_FILE"
