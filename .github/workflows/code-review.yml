name: Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "**/*.swift"
      - "**/*.pbxproj"
      - "**/*.entitlements"
      - "**/*.plist"
      - "**/Package.resolved"

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'targendaz2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Code Review
        id: review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      # The full output stays hidden because this repository is public. This prints only which
      # tools ran, whether each returned ok or an error, which were denied, and which models were
      # used, so a review that skipped its agents shows up in the log without exposing anything
      # the agents read.
      - name: Summarize review tool use
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '
            def messages: if type == "array" then .[] else . end;
            def describe:
              if .name == "Agent" or .name == "Task" then
                "\(.name) type=\(.input.subagent_type // "-") model=\(.input.model // "-")"
              elif .name == "Bash" then
                "Bash \((.input.command // "") | split(" ") | .[0:3] | join(" "))"
              else .name end;

            # Each tool result says only whether it was an error; its content is never printed.
            ([messages | select(.type == "user") | .message.content[]?
              | select(type == "object" and .type == "tool_result" and .tool_use_id != null)
              | {key: .tool_use_id, value: (if .is_error then "error" else "ok" end)}]
              | from_entries) as $results

            | "Tool calls:",
            (messages | select(.type == "assistant")
              | (if .parent_tool_use_id then "subagent" else "main" end) as $who
              | .message.content[]? | select(.type == "tool_use")
              | "  \($who): \(describe) -> \($results[.id // ""] // "no result")"),
            "Permission denials:",
            (messages | select(.type == "result") | (.permission_denials // [])[]
              | "  " + ({name: .tool_name, input: .tool_input} | describe)),
            (messages | select(.type == "result")
              | "Turns: \(.num_turns), models: \(.modelUsage // {} | keys | join(", "))")
          ' "$EXECUTION_FILE"
